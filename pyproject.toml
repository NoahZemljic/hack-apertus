[project]
name = "hack-apertus"
version = "0.1.0"
description = "Hack Apertus 2026 ZHAW robotics challenge"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23,<5",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
vision = [
    "lm-format-enforcer>=0.11.3,<0.12",
    "qwen-vl-utils>=0.0.8,<1",
    "transformers>=4.57.6,<6",
]

[tool.uv]
package = false
