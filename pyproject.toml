[project]
name = "hack-apertus"
version = "0.1.0"
description = "Hack Apertus 2026 ZHAW robotics challenge"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23,<5",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<6",
    "packaging>=24,<27",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
vision = [
    "lm-format-enforcer>=0.11.3,<0.12",
    "matplotlib>=3.8,<4",
    "openai>=2,<3",
    "qwen-vl-utils>=0.0.8,<1",
    "transformers>=5.10.4,<6",
]
# GPU containers provide their matching CUDA builds. Install this extra only
# when Torch/Torchvision are not already supplied by the shared container.
accelerator = [
    "torch>=2.8,<3",
    "torchvision>=0.23,<1",
]

[tool.uv]
package = false
