# Build/import once: see docs/CLARIDEN.md. No startup installs or downloads.
image = "${SCRATCH}/hack-apertus/containers/pipeline-arm64.sqsh"
mounts = ["${HOME}:${HOME}", "${SCRATCH}:${SCRATCH}"]
workdir = "/opt/hack-apertus"
entrypoint = false
writable = true

[env]
HF_HOME = "${SCRATCH}/hack-apertus/huggingface"
XDG_CACHE_HOME = "${SCRATCH}/hack-apertus/cache"
MPLCONFIGDIR = "${SCRATCH}/hack-apertus/cache/matplotlib"
VLLM_CACHE_ROOT = "${SCRATCH}/hack-apertus/cache/vllm"
CUDA_CACHE_PATH = "${SCRATCH}/hack-apertus/cache/cuda"
TORCHINDUCTOR_CACHE_DIR = "${SCRATCH}/hack-apertus/cache/torchinductor"
TRITON_CACHE_DIR = "${SCRATCH}/hack-apertus/cache/triton"
HACK_APERTUS_DATA = "${HOME}/hack-apertus/dataset"
HACK_APERTUS_OUTPUT = "${SCRATCH}/hack-apertus/outputs"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
HF_HUB_DISABLE_TELEMETRY = "1"
VLLM_NO_USAGE_STATS = "1"
OMP_NUM_THREADS = "8"
