# PyTorch/CUDA container used by the Qwen perception stage on Clariden.
image = "ghcr.io#swiss-ai/vllm_apertus_1.5_release:latest-arm64"

mounts = [
  "${HOME}:${HOME}",
  "${SCRATCH}:${SCRATCH}"
]

workdir = "${HOME}/hack-apertus"

entrypoint = true
writable = true

# Run from the repository root on a login node:
# srun --account=g239 --partition=debug --nodes=1 --ntasks=1 --cpus-per-task=8 --cpu-bind=none --time=01:30:00 --job-name=hack-apertus --environment=./containers/vision.edf.toml --pty bash
